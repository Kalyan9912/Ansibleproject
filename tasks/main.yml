---
# tasks file for Kalyan
- name: "Install apache httpd"
  ansible.builtin.apt:
    name: apache2
    state: present
    update_cache: yes

- name:  "copy file with owner permission"
  ansible.builtin.copy:
    src: /home/ubuntu/Kalyan/files/index.html
    dest: /var/www/html
    owner: root
    group: root
    mode: '0644'
